# Netlify builds the Hangar site on every push to main (and on deploy previews for PRs).
# The build runs each lab's program and every project's and lab's tests so the site can
# show results. Rust isn't set up in Netlify's image by default, so install the stable
# toolchain first; if that fails, Rust labs show as "no tests run" instead of failing.
[build]
  command = "(rustup show active-toolchain || rustup default stable --profile minimal) >/dev/null 2>&1; node site/build.mjs"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "22"
  GO_VERSION = "1.24"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
