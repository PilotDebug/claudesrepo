<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kit Build Log</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Kit Build Log</h1>
      <p>Every hour in the shop, by assembly and by week.</p>
    </div>
    <div class="actions">
      <button type="button" id="export">Export CSV</button>
      <label class="button">Import CSV<input type="file" id="import" accept=".csv,text/csv" hidden></label>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="Totals">
      <div class="stat hero"><b id="total">0</b><span>total hours</span></div>
      <div class="stat"><b id="week">0</b><span>this week</span></div>
      <div class="stat"><b id="sessions">0</b><span>sessions</span></div>
      <div class="stat"><b id="avg">—</b><span>hours / session</span></div>
    </section>

    <section class="card log">
      <h2>Log a session</h2>
      <form id="add" autocomplete="off">
        <label>Date <input name="date" type="date" required></label>
        <label>Assembly <input name="assembly" list="assemblies" required placeholder="Wings"></label>
        <label>Hours <input name="hours" type="number" step="0.25" min="0.25" max="24" required placeholder="2.5"></label>
        <label class="wide">What got done <input name="note" placeholder="Drilled and deburred left aileron skins"></label>
        <button type="submit">Add session</button>
      </form>
      <datalist id="assemblies"></datalist>
      <p id="form-msg" class="msg" role="status"></p>
    </section>

    <section class="card">
      <h2>Hours by assembly</h2>
      <div id="by-assembly" class="hbars"></div>
    </section>

    <section class="card">
      <h2>Hours per week <small>last 12 weeks</small></h2>
      <div id="by-week" class="vbars"></div>
    </section>

    <section class="card sessions">
      <h2>Sessions</h2>
      <div id="table"></div>
    </section>
  </main>
  <div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
