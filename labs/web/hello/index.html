<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 1.5rem; }
    input { font: inherit; padding: .5rem .75rem; border-radius: .5rem;
            border: 1px solid #8886; background: transparent; }
  </style>
</head>
<body>
  <main>
    <h1 id="out"></h1>
    <label>Your name <input id="name" autocomplete="off" placeholder="world"></label>
  </main>
  <script type="module">
    import { greet } from "./greet.js";
    const out = document.getElementById("out");
    const input = document.getElementById("name");
    const render = () => { out.textContent = greet(input.value); };
    input.addEventListener("input", render);
    render();
  </script>
</body>
</html>
